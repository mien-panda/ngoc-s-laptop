<style>

.err{color:var(--bad);font-size:12px;letter-spacing:.2em;min-height:40px;line-height:1.7;margin-bottom:6px}

.top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.ib{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:3px;font-size:18px;cursor:pointer}
.top .t{flex:1;font-size:11px;letter-spacing:.2em;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.ah{padding:26px 20px 8px;max-width:520px;margin:0 auto;width:100%}
.ah h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;letter-spacing:.06em;margin:0 0 4px;font-weight:600}
.ah p{margin:0;color:var(--gold);font-size:11px;letter-spacing:.3em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px;max-width:520px;margin:0 auto;width:100%}
.card{min-height:128px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px;text-align:left;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;position:relative;font-family:inherit}

.paper .r{text-align:right}
.paper p{margin:6px 0}
.sgs{display:flex;gap:20px;margin-top:26px}.sgb{flex:1;border-top:1px solid #23211c;padding-top:4px;font:500 8.5px Inter,sans-serif;letter-spacing:.1em;color:#555;position:relative}
.sig{font:600 24px "Dancing Script",cursive;color:#1d3a6e;position:absolute;top:-30px;left:6px;transform:rotate(-4deg)}
.stamp{position:absolute;right:46px;border:3px double #8a2f28;color:#8a2f28;font:600 10px Inter,sans-serif;letter-spacing:.15em;text-align:center;padding:10px 14px;transform:rotate(-9deg);opacity:.75;border-radius:4px;line-height:1.5}

.bar{display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);align-items:center}
.bar .pg{flex:1;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--mu)}
</style></head><body><div id="app"></div>

  `<div class="q">WHO DOES THIS FILE BELONG TO?</div><div class="sg">${CONFIG.suspects.map(s=>`<button class="sp ${sel===s?'on':''}" data-a="sel" data-s="${s}">${s}</button>`).join("")}</div><div class="err" id="er"></div><button class="btn fill" id="ab" data-a="check" ${sel?'':'disabled'}>ACCESS DOCUMENT</button><button class="btn dim" data-a="ref">VIEW ARCHETYPE REFERENCE</button>`)+`</div>${foot}`;}
 else if(view==="viewer"){const d=documents[cur];
  h=`<div class="vw"><div class="top"><button class="ib" data-a="back" aria-label="Back">←</button><div class="t">${d.title.toUpperCase()}</div><button class="ib" data-a="zo">−</button><button class="ib" data-a="zi">+</button></div><div class="sc"><div class="pw" id="pw2"><div class="paper" id="pp">${page(d)}</div></div></div><div class="bar"><button class="ib" data-a="prev" ${pg<1?'disabled':''}>‹</button><div class="pg">PAGE ${pg+1} / ${d.pages.length}</div><button class="ib" data-a="next" ${pg>=d.pages.length-1?'disabled':''}>›</button></div></div>`;}
 app.innerHTML=h;
 if(view==="viewer")fit();
}
function page(d){return `<div class="lh"><div><div class="o">${d.org}</div><div class="os">${d.orgSub}</div></div><div class="r">${d.ref}<br>DATE: ${d.date}<br>FICTIONAL RECORD</div></div><span class="cf">${d.conf}</span>${d.pages[pg]}<div class="pf"><span>${d.ref.split(' ').pop()}</span><span>FICTIONAL GAME PROP</span><span>PAGE ${pg+1} OF ${d.pages.length}</span></div>`}
function fit(){const p=$("#pp"),w=$("#pw2");if(!p)return;const s=Math.max(.3,(innerWidth-16)/595)*Z;p.style.transform=`scale(${s})`;w.style.width=595*s+"px";w.style.height=p.offsetHeight*s+"px"}
addEventListener("resize",fit);

function go(v){view=v;render();scrollTo(0,0)}
function err(m){const e=$("#er");if(e)e.innerHTML=m}
function bump(id){const b=$("#"+id);if(b){b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}}

app.addEventListener("click",e=>{
 const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;
 if(a==="go-lock")go("lock");
 else if(a==="try-pw"){const v=$("#pw").value.trim().toUpperCase();
  if(v===CONFIG.password.toUpperCase()){S.unlocked=true;save();view="granted";render();setTimeout(()=>go("archive"),1500)}
  else{err("ACCESS DENIED<br>INVALID PASSWORD");bump("pb")}}
 else if(a==="open"){cur=+t.dataset.i;sel=null;pg=0;Z=1;verified=false;go(S.solved.includes(documents[cur].id)?"viewer":"challenge")}
 else if(a==="sel"){sel=t.dataset.s;render()}
 else if(a==="check"){if(sel===documents[cur].correctSuspect){verified=true;if(!S.solved.includes(documents[cur].id))S.solved.push(documents[cur].id);save();render()}
  else{err("ACCESS DENIED<br>The selected identity does not match this document.");bump("ab")}}
 else if(a==="view"){pg=0;Z=1;go("viewer")}
 else if(a==="back")go(view==="viewer"&&!S.solved.includes(documents[cur].id)?"challenge":"archive");
 else if(a==="ref")refSheet();
 else if(a==="zi"){Z=Math.min(3,Z+.35);fit()}
 else if(a==="zo"){Z=Math.max(.6,Z-.35);fit()}
 else if(a==="prev"){pg--;render()}
 else if(a==="next"){pg++;render()}
 else if(a==="close")$(".sheet").remove();
});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&view==="lock")$("#pb").click()});
function refSheet(){const s=document.createElement("div");s.className="sheet";
 s.innerHTML=`<div class="sh"><div class="lk" style="margin-bottom:6px">ARCHETYPE REFERENCE</div>${archetypes.map(a=>`<div class="ar"><div class="i">${a.icon}</div><div><b>${a.name}</b><p>${a.desc}</p></div></div>`).join("")}<br><button class="btn" data-a="close">CLOSE</button></div>`;
 s.addEventListener("click",e=>{if(e.target===s)s.remove()});app.appendChild(s)}
render();
</script></body></html>
